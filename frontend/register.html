<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="features">

<div class="feature-card"
style="max-width:450px;margin:auto;">

<h1>📝 Student Registration</h1>

<br>

<form id="registerForm">

<input
id="name"
type="text"
placeholder="Full Name"
required
style="width:100%;padding:13px;margin:8px 0;"
>

<input
id="email"
type="email"
placeholder="Student Email"
required
style="width:100%;padding:13px;margin:8px 0;"
>

<input
id="password"
type="password"
placeholder="Create Password"
required
style="width:100%;padding:13px;margin:8px 0;"
>

<button
type="submit"
class="login-btn"
style="border:none;padding:13px 25px;margin-top:15px;"
>
Create Account
</button>

</form>

<br>

<p id="message"></p>

<br>

<p>
Already have an account?
</p>

<br>

<a href="login.html">
Student Login
</a>

<br><br>

<a href="index.html">
← Back to Home
</a>

</div>

</section>


<script>

const API_URL = "https://lms-project-bevq.onrender.com";

document
.getElementById("registerForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const name =
        document.getElementById("name").value;

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    message.textContent = "Creating account...";

    try {

        const response = await fetch(
            API_URL + "/api/register",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password
                })
            }
        );

        const data =
            await response.json();

        message.textContent =
            data.message;

        if (response.ok) {

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1000);

        }

    } catch (error) {

        console.error(error);

        message.textContent =
            "Unable to connect to server. Make sure the backend is running.";

    }

});

</script>

</body>

</html>
